# 持续集成（CI）：代码质量与构建校验
#
# 触发时机：
# - push 到 main / develop 分支
# - 所有 pull request
#
# 执行内容：
# 1. 安装依赖（npm ci，基于 lock 文件，保证可复现）
# 2. ESLint 代码检查（npm run lint）
# 3. 生产构建（npm run build，输出 dist/）

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20, 22] # Vite 7 要求 Node 20.19+ / 22.12+

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint 代码检查
        run: npm run lint

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物（供排查）
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dist-${{ matrix.node-version }}
          path: dist/
          retention-days: 7
